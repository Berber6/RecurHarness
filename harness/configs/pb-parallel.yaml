environment:
  cwd: "/workspace"
  timeout: 180
  container_timeout: "14h"
  environment_class: "docker"
  executable: "docker"
  run_args:
    - "--rm"
    - "--network"
    - "none"
    - "--cpus"
    - "2"
    - "--memory"
    - "1536m"
    - "--memory-swap"
    - "1536m"
    - "--user"
    - "agent"
    - "--cap-drop"
    - "SYS_PTRACE"
  env: {}

model:
  model_name: "openai/DeepSeek-V4.1-Flash-1017"
  litellm_model_registry: "/home/berber/.config/mini-swe-agent/glm_prices.json"
  cost_tracking: "default"
  model_kwargs:
    timeout: 300
